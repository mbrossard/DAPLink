[package]
name = "daplink-rp-pio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "PIO SWD/JTAG wire backend for daplink-rs on RP microcontrollers"

[workspace]

[dependencies]
daplink-rs = { path = "../../crates/daplink-rs" }
# Raw register access only, no runtime.
rp-pac = { version = "7.0", default-features = false, optional = true }
# thumbv6m has no atomic CAS; portable-atomic routes StaticCell's CAS through critical-section.
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

# The consumer selects the chip; without one, only the runtime-neutral logic and its host tests build.
[features]
rp2040 = ["dep:rp-pac", "rp-pac/rp2040"]
rp235x = ["dep:rp-pac", "rp-pac/rp235x"]

[dev-dependencies]
# The simulated JTAG-DP the autonomous programs are interpreted against.
dap-differential = { package = "dap-conformance", path = "../../crates/dap-conformance" }

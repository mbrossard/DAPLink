[package]
name = "daplink-usb-device"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Polled (usb-device) USB adapter for daplink-rs"

[workspace]

# Never add a `default` entry: feature unification would force it on for every firmware.
[features]
defmt = ["dep:defmt"]

[dependencies]
usb-device = "0.3"
daplink-core = { path = "../../crates/daplink-core" }
daplink-rs = { path = "../../crates/daplink-rs" }
daplink-vfs = { path = "../../crates/daplink-vfs" }
defmt = { version = "1", optional = true }

[dev-dependencies]
daplink-core = { path = "../../crates/daplink-core", features = ["bot-fixtures"] }
critical-section = { version = "1", features = ["std"] }

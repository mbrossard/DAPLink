[package]
name = "daplink-lpc55-hal"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "lpc55-hal platform support for polled LPC55S69 daplink-rs probes"

[workspace]

[dependencies]
# Maintained lpc55-hal fork (branch: embedded-hal-10), rev-pinned.
lpc55-hal = { git = "https://github.com/mbrossard/lpc55-hal.git", rev = "7b975ac0ba4cf9593efb5a0b0a594198ec85beb3", features = ["rt"] }
usb-device = "0.3"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
critical-section = "1"
static_cell = "2"

daplink-core = { path = "../../crates/daplink-core" }
daplink-rs = { path = "../../crates/daplink-rs" }
daplink-spi-swd = { path = "../../crates/daplink-spi-swd", optional = true }

[features]
# Masked-GPIO SWD word path and fast JTAG scans, for a firmware's `accel` feature.
masked-swd = ["dep:daplink-spi-swd"]

# Transmit transfer counters readable over SWD; never in a shipping image.
probe-timing = []

[dev-dependencies]
# dap-rs as the reference for the block path, both against one simulated target.
dap-differential = { package = "dap-conformance", path = "../../crates/dap-conformance", features = ["differential"] }

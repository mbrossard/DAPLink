[package]
name = "daplink-stm32f1-embassy"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "embassy-stm32 platform support for STM32F1 daplink-rs probes"

[workspace]

# F1-family only; the firmware supplies the embassy-stm32 chip feature.
[dependencies]
embassy-stm32 = { version = "0.6.0", default-features = false, features = ["unstable-pac"] }
# The firmware installs the time driver.
embassy-time = "0.5"
embassy-usb-driver = "0.2"
cortex-m = "0.7"
static_cell = "2"
# Guards the cached USB serial.
critical-section = "1"
daplink-rs = { path = "../../crates/daplink-rs" }
daplink-embassy-usb = { path = "../daplink-embassy-usb" }

# A chip feature only so the crate builds on its own.
[dev-dependencies]
embassy-stm32 = { version = "0.6.0", features = ["stm32f103cb"] }

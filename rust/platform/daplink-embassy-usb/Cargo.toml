[package]
name = "daplink-embassy-usb"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "embassy-usb adapter for daplink-rs probe firmware"

[workspace]

[dependencies]
embassy-usb = "0.6.0"
embassy-futures = "0.1"
embassy-sync = "0.8"
daplink-rs = { path = "../../crates/daplink-rs" }
static_cell = "2"
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
daplink-vfs = { path = "../../crates/daplink-vfs" }
embassy-time = "0.5"
critical-section = { version = "1", optional = true }

# Never add a `default` entry: feature unification would force it on for every firmware.
[features]
# CDC packet and short-packet counters, readable over SWD.
usb-counters = []

# A DWT event ring over the DAP pipeline and USB interrupts, dumped by symbol over SWD.
dap-trace = ["dep:critical-section"]

# DAP packets larger than the bulk endpoint, spanning several USB packets each way.
multi-packet = []

# Host tests supply the critical-section impl and a manually advanced time driver.
[dev-dependencies]
critical-section = { version = "1", features = ["std"] }
embassy-time = { version = "0.5", features = ["mock-driver", "generic-queue-8"] }
daplink-decoder = { path = "../../crates/daplink-decoder", default-features = false }

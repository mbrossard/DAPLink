[package]
name = "stm32h523-embassy"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: this firmware pins its own embedded target and HAL feature graph.
[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h523ce", "unstable-pac", "memory-x", "time-driver-any"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1"
# The pipelined DAP loop's two edge-triggered signals between its reader and executor futures.
embassy-sync = "0.8"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }

daplink-rs = { path = "../../crates/daplink-rs" }
# The SPI-session SWD engine this firmware supplies a register seam for; `accel` only.
daplink-spi-swd = { path = "../../crates/daplink-spi-swd", optional = true }
daplink-stm32-embassy = { path = "../../platform/daplink-stm32-embassy" }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }

static_cell = "2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

# Optional defmt-RTT bring-up logging, off by default.
defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

[features]
default = ["guard"]
# `guard` bounds-checks each report against the engine's consumption before dispatch.
guard = ["daplink-rs/guard"]
# `flash` adds the drag-n-drop mass-storage drive and the vendor flash commands over the
# flash-wins mux; it is the target-less spine, so a `flash-<chip>` row must select the target.
flash = ["dep:daplink-vfs", "dep:daplink-targets", "daplink-embassy-usb/flash"]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
# `accel` drives SWD through SPI2 half-duplex sessions on the same probe pads; JTAG stays
# bit-bang and the VCOM/SWO pins are unchanged. Without it the wire is bit-banged by the CPU.
accel = ["dep:daplink-spi-swd", "daplink-stm32-embassy/spi-swd"]
# Bench-only: lifts the injected SCK ceiling to u32::MAX so the rung ladder follows the host's
# request unclamped; only meaningful with `accel`, never shipped.
no-clamp = []
# Free-running CDC packet counters, read off the image's symbols over SWD. Diagnostic: a leg that
# delivers every byte late looks the same in the byte ledger whether the probe could not send or
# had nothing to send, and the packet counts separate the two.
usb-counters = ["daplink-embassy-usb/usb-counters"]
# RTT-backed defmt logging, captured by a probe attached over SWD; host-side only (no image
# growth beyond the `.defmt` string table, which the linker keeps out of the loadable image).
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "daplink-rs/defmt",
]

[[bin]]
name = "stm32h523-embassy"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep debug info in the ELF (probe-rs uses it); flashable images are unaffected.
debug = 2
panic = "abort"
overflow-checks = false

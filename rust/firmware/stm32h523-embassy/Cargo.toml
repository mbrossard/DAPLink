[package]
name = "stm32h523-embassy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "executor-interrupt"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32h523ce", "unstable-pac", "memory-x", "time-driver-any"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1"
# 50 MHz tick: the H5 USB receive erratum delay spins on it per OUT packet.
embassy-time = { version = "0.5", features = ["tick-hz-50_000_000"] }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-spi-swd = { path = "../../crates/daplink-spi-swd" }
daplink-stm32-embassy = { path = "../../platform/daplink-stm32-embassy", features = ["block-swd", "spi-swd"] }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }

static_cell = "2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

[features]
default = []
# Target-less drag-n-drop spine; a `flash-<chip>` row selects the target.
flash = ["dep:daplink-vfs", "dep:daplink-targets",]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
flash-nrf52840 = ["flash", "daplink-targets/nrf52840"]
flash-nrf52833 = ["flash", "daplink-targets/nrf52833"]
# SPI2-session SWD in place of the default bit-bang engine; JTAG stays bit-bang.
accel = []
# The dap-rs bit-bang engine in place of the fast one.
plain-bitbang = []
# Duplex SPI SWD: data sensed on PB14 (MISO), driven from PB15 (MOSI) only to transmit.
accel-duplex = ["accel"]
# `DAP_Transfer` and `DAP_TransferBlock` as back-to-back SPI sessions.
spi-block = ["accel", "daplink-stm32-embassy/spi-block"]
# A 512-byte DAP packet spanning several 64-byte bulk packets.
dap-packet-512 = ["daplink-embassy-usb/multi-packet"]
# Diagnostic GPIO toggle sequence on PB10/PB15 at boot; never shipped.
wire-probe = ["daplink-stm32-embassy/wire-probe"]
# Diagnostic CDC packet counters, read over SWD.
usb-counters = ["daplink-embassy-usb/usb-counters"]
# Diagnostic DWT event trace, dumped from `DAP_TRACE` over SWD; never shipped.
dap-trace = ["daplink-embassy-usb/dap-trace"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "daplink-rs/defmt",
    "daplink-vfs?/defmt",
]

[[bin]]
name = "stm32h523-embassy"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

[package]
name = "stm32f103-embassy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "0.6.0", features = ["stm32f103cb", "unstable-pac", "memory-x", "time-driver-any"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1"
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-spi-swd = { path = "../../crates/daplink-spi-swd", optional = true }
daplink-stm32f1-spi-swd = { path = "../../platform/daplink-stm32f1-spi-swd", optional = true }
daplink-stm32f1-embassy = { path = "../../platform/daplink-stm32f1-embassy" }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }

static_cell = "2"
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"

defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

[features]
default = []
# nanoDAP V2.3 wiring: PB15 D+ pull-up (active low), LED on PC13, TDO on PA5, no SWO.
nanodap = []
# Target-less drag-n-drop spine; a `flash-<chip>` row selects the target.
flash = ["dep:daplink-vfs", "dep:daplink-targets",]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
flash-nrf52840 = ["flash", "daplink-targets/nrf52840"]
flash-nrf52833 = ["flash", "daplink-targets/nrf52833"]
# SPI2-assisted SWD reads (nanodap pin map); JTAG stays bit-bang.
accel = ["dep:daplink-spi-swd", "dep:daplink-stm32f1-spi-swd"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-stm32/defmt",
    "daplink-rs/defmt",
    "daplink-vfs?/defmt",
]

[[bin]]
name = "stm32f103-embassy"
test = false
bench = false

[profile.release]
# The timing constants are calibrated at opt-level 2.
opt-level = 2
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

[package]
name = "rp2350-pico2-embassy"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: this firmware pins its own embedded target and HAL feature graph.
[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# `imagedef-secure-exe` embeds the RP2350 IMAGE_DEF block the bootrom looks for in `.start_block`.
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "imagedef-secure-exe"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1"
# The pipelined DAP loop's two edge-triggered signals between its reader and executor futures.
embassy-sync = "0.8"
embedded-io-async = "0.7"
# The carrier-bank heartbeat's periodic tick; only spawned under `carrier-leds`.
embassy-time = { version = "0.5", optional = true }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-rp-embassy = { path = "../../platform/daplink-rp-embassy", default-features = false, features = ["rp2350"] }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-rp-pio = { path = "../../platform/daplink-rp-pio", features = ["rp235x"], optional = true }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }

static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

# Optional defmt-RTT bring-up logging, off by default.
defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

# `accel` drives SWD from PIO and fuses JTAG words. `bitbang` selects the CPU engine and wins
# when both features are enabled, so it can override the accelerated default.
[features]
default = ["accel", "guard"]
accel = ["dep:daplink-rp-pio", "daplink-rs/rp2040-jtag-accel"]
bitbang = []
# RTT-backed defmt logging, captured by a probe attached over SWD; host-side only (no image
# growth beyond the `.defmt` string table, which the linker keeps out of the loadable image).
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-rp/defmt",
    "daplink-rs/defmt",
]
# `flash` adds the drag-n-drop mass-storage drive and the vendor flash commands over the
# flash-wins mux; it is the target-less spine, so a `flash-<chip>` row must select the target.
flash = ["dep:daplink-vfs", "dep:daplink-targets", "daplink-embassy-usb/flash"]
flash-rp2040 = ["flash", "daplink-targets/rp2040"]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
flash-rp2350 = ["flash", "daplink-targets/rp2350"]
# `guard` bounds-checks each report against the engine's consumption before dispatch.
guard = ["daplink-rs/guard"]
# Non-default 200 MHz system clock; PIO builds use the uniform five-cycle SWCLK cell.
overclock-200mhz = ["daplink-rp-embassy/clock-200mhz", "daplink-rp-pio?/clock-200mhz"]
# Free-running CDC packet counters, read off the image's symbols over SWD. Diagnostic: a link full
# of short packets is not bandwidth-bound, and the probe's byte counters cannot tell the two apart.
usb-counters = ["daplink-embassy-usb/usb-counters"]
# `carrier-leds` claims the Pico-family carrier's five-LED debug bank (GP10/11/12/14/15); off by
# default, since it is a carrier-specific wiring choice, not every Pico 2 deployment's.
carrier-leds = ["dep:embassy-time", "daplink-rp-embassy/carrier-leds"]

[[bin]]
name = "rp2350-pico2-embassy"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Keep debug info in the ELF (probe-rs uses it); flashable images are unaffected.
debug = 2
panic = "abort"
overflow-checks = false

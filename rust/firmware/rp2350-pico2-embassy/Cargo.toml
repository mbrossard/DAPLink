[package]
name = "rp2350-pico2-embassy"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
# `imagedef-secure-exe` embeds the RP2350 IMAGE_DEF block the bootrom looks for in `.start_block`.
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "imagedef-secure-exe"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1"
embedded-io-async = "0.7"
embassy-time = { version = "0.5", optional = true }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-rp-embassy = { path = "../../platform/daplink-rp-embassy", default-features = false, features = ["rp2350"] }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-rp-pio = { path = "../../platform/daplink-rp-pio", features = ["rp235x"], optional = true }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }

static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"

defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

[features]
default = ["accel"]
# Generic PIO0 for sequences and fallbacks, shared PIO1 for complete SWD/JTAG transfers.
accel = ["dep:daplink-rp-pio"]
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "embassy-executor/defmt",
    "embassy-rp/defmt",
    "daplink-rs/defmt",
    "daplink-vfs?/defmt",
]
# Target-less drag-n-drop spine; a `flash-<chip>` row selects the target.
flash = ["dep:daplink-vfs", "dep:daplink-targets",]
flash-rp2040 = ["flash", "daplink-targets/rp2040"]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
flash-rp2350 = ["flash", "daplink-targets/rp2350"]
flash-nrf52840 = ["flash", "daplink-targets/nrf52840"]
flash-nrf52833 = ["flash", "daplink-targets/nrf52833"]
# 200 MHz system clock.
overclock-200mhz = []
# A 512-byte DAP packet spanning several 64-byte bulk packets.
dap-packet-512 = ["daplink-embassy-usb/multi-packet"]
# Diagnostic CDC packet counters, read over SWD.
usb-counters = ["daplink-embassy-usb/usb-counters"]
# The carrier's five-LED debug bank (GP10/11/12/14/15).
carrier-leds = ["dep:embassy-time"]

[[bin]]
name = "rp2350-pico2-embassy"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

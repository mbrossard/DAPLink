[package]
name = "debugprobe"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.10.0", features = ["unstable-pac", "time-driver", "critical-section-impl", "rp2040"] }
embassy-futures = "0.1"

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-rp-embassy = { path = "../../platform/daplink-rp-embassy", features = ["rp2040"] }
daplink-embassy-usb = { path = "../../platform/daplink-embassy-usb" }
daplink-rp-pio = { path = "../../platform/daplink-rp-pio", features = ["rp2040"], optional = true }

static_cell = "2"
cortex-m = "0.7"
cortex-m-rt = "0.7"
panic-halt = "0.2"
# thumbv6m has no atomic CAS; portable-atomic routes through critical-section (from embassy-rp).
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }

[features]
default = ["accel"]
# PIO0 sequences and PIO1 complete SWD transfers over the board's split SWDIO pads; no JTAG.
accel = ["dep:daplink-rp-pio"]
# 180 MHz system clock.
overclock-180mhz = []
# A 512-byte DAP packet spanning several 64-byte bulk packets.
dap-packet-512 = ["daplink-embassy-usb/multi-packet"]

[[bin]]
name = "debugprobe"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

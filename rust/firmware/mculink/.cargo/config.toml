[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip LPC55S69JBD64"
# Word-align every function so the SRAMX bodies' timing does not depend on the code before them.
rustflags = ["-C", "llvm-args=-align-all-functions=2"]

[build]
target = "thumbv8m.main-none-eabihf"

# defmt filters at compile time and defaults to `error`; override with `DEFMT_LOG`.
[env]
DEFMT_LOG = "info"

[package]
name = "mculink"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# critical-section-single-core is sound here only because core1 is never released from reset.
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
# Below 2.3: its Send check on task locals rejects the flash engine and VFS, and drops their cfgs.
rtic = { version = ">=2.1, <2.3", features = ["thumbv8main-backend"] }
lpc55-hal = { git = "https://github.com/mbrossard/lpc55-hal.git", rev = "7b975ac0ba4cf9593efb5a0b0a594198ec85beb3", features = ["rt"] }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-lpc55-hal = { path = "../../platform/daplink-lpc55-hal" }
daplink-usb-device = { path = "../../platform/daplink-usb-device" }
daplink-vfs = { path = "../../crates/daplink-vfs", optional = true }
daplink-targets = { path = "../../crates/daplink-targets", default-features = false, optional = true }
static_cell = "2"

panic-halt = "0.2"

defmt = { version = "1", optional = true }
defmt-rtt = { version = "1", optional = true }
panic-probe = { version = "1", optional = true, features = ["print-defmt"] }

[features]
default = ["accel"]
# `bitbang` wins over the default `accel` where both are on.
bitbang = []
# Diagnostic USB1 interrupt timing statics; never shipped.
probe-timing = ["daplink-lpc55-hal/probe-timing"]
# Masked-GPIO SWD and JTAG engine.
accel = ["daplink-lpc55-hal/masked-swd"]
# 96 MHz FRO core clock instead of the default 150 MHz PLL0.
core-96mhz = []
defmt = [
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:panic-probe",
    "daplink-rs/defmt",
    "daplink-usb-device/defmt",
    "daplink-vfs?/defmt",
]
# Target-less drag-n-drop spine; a `flash-<chip>` row selects the target.
flash = [
    "dep:daplink-vfs",
    "dep:daplink-targets",
]
flash-stm32f401 = ["flash", "daplink-targets/stm32f401ce"]
flash-nrf52840 = ["flash", "daplink-targets/nrf52840"]
flash-nrf52833 = ["flash", "daplink-targets/nrf52833"]

[[bin]]
name = "mculink"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

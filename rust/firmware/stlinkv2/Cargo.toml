[package]
name = "stlinkv2"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
rtic = { version = "2.1", features = ["thumbv7-backend"] }
stm32f1xx-hal = { version = "0.11", features = ["stm32f103"] }

daplink-rs = { path = "../../crates/daplink-rs" }
daplink-stm32f1-hal = { path = "../../platform/daplink-stm32f1-hal" }
daplink-usb-device = { path = "../../platform/daplink-usb-device" }
daplink-spi-swd = { path = "../../crates/daplink-spi-swd", optional = true }
daplink-stm32f1-spi-swd = { path = "../../platform/daplink-stm32f1-spi-swd", optional = true }
static_cell = "2"

panic-halt = "0.2"
daplink-test-protocol = { path = "../../tests/crates/daplink-test-protocol", optional = true }
rtt-target = { version = "0.5", optional = true }

[features]
default = []
# SPI-assisted SWD plus board-specialized GPIO JTAG.
accel = ["dep:daplink-spi-swd", "dep:daplink-stm32f1-spi-swd"]
# SWD plus an RTT scanner, replacing JTAG and SWO to free their pads.
conntest = ["dep:daplink-test-protocol", "dep:rtt-target"]

[[bin]]
name = "stlinkv2"
test = false
bench = false

[profile.release]
# Changing optimization requires recalibrating the bit-bang delay.
opt-level = "s"
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

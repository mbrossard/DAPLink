[package]
name = "daplink-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "DAP debug-probe composition over dap-rs"

[workspace]

[dependencies]
daplink-core = { path = "../daplink-core" }
dap-rs = { git = "https://github.com/probe-rs/dap-rs.git", rev = "a867ca7b41547b24aaad52b913528575685a5df5" }
embedded-hal = "1.0"
critical-section = "1"
# Firmware features select the generated target registry entries.
daplink-flash = { path = "../daplink-flash", default-features = false }
daplink-targets = { path = "../daplink-targets", default-features = false }
static_cell = "2"
heapless = "0.8"
defmt = { version = "1", optional = true }

[features]
defmt = ["dep:defmt", "daplink-flash/defmt"]

[dev-dependencies]
daplink-vfs = { path = "../daplink-vfs" }
critical-section = { version = "1", features = ["std"] }
embedded-hal-mock = "0.11"
# dap-rs as the reference for the bit-bang engines, both against one simulated target.
dap-differential = { package = "dap-conformance", path = "../dap-conformance", features = ["differential"] }

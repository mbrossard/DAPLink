[package]
name = "daplink-vfs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Virtual FAT16 volume and drag-n-drop transfer engine for daplink-rs"

[workspace]

[dependencies]
daplink-decoder = { path = "../daplink-decoder", default-features = false }
daplink-core = { path = "../daplink-core", default-features = false }
static_cell = "2"
heapless = "0.8"
critical-section = "1"
# thumbv6m has no atomic CAS; route StaticCell's through critical-section.
portable-atomic = { version = "1", default-features = false, features = ["critical-section"] }
defmt = { version = "1", optional = true }

[features]
# Trace each transfer-engine decision over defmt.
defmt = ["dep:defmt"]

[dev-dependencies]
# Host tests supply the std critical-section implementation.
critical-section = { version = "1", features = ["std"] }
# `bot-fixtures` carries the shared Bulk-Only case table.
daplink-core = { path = "../daplink-core", default-features = false, features = [
    "bot-fixtures",
] }
daplink-decoder = { path = "../daplink-decoder", default-features = false, features = [
    "std",
] }
# The write-order replay sweeps every chip record's flash windows.
daplink-targets = { path = "../daplink-targets", default-features = false, features = [
    "rp2040",
    "rp2350",
    "stm32f401ce",
] }


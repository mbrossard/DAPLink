[package]
name = "daplink-targets"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Flash-target records, generated flash algorithms, and the target-selection seam"

[workspace]

[features]
default = []
synthetic = []
# Shared algorithm modules, selected transitively by chip features.
_algo_stm32f4 = []
_algo_rp2040 = []
_algo_rp2350 = []
_algo_nrf52 = []
# Per-family reset/unlock modules, selected transitively by chip features.
# RP apps leave interrupts live, so their algorithms run masked.
_family_rp2040 = ["daplink-flash/mask-interrupts"]
_family_rp2350 = ["daplink-flash/mask-interrupts"]
_family_nrf52 = []
# STM32F401CE: 512 KiB of non-uniformly sectored F4 flash.
stm32f401ce = ["_algo_stm32f4"]
rp2040 = ["_algo_rp2040", "_family_rp2040"]
# RP2350: dormant-wake and ADIv6 bring-up, with the RAM-resident bootrom-shim algorithm.
rp2350 = ["_algo_rp2350", "_family_rp2350"]
nrf52840 = ["_algo_nrf52", "_family_nrf52"]
nrf52833 = ["_algo_nrf52", "_family_nrf52"]

[dependencies]
daplink-flash = { path = "../daplink-flash", default-features = false }

[dev-dependencies]
static_cell = "2"

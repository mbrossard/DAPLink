[package]
name = "test-stm32f401"
version = "0.1.0"
edition = "2021"
publish = false

# Own workspace: pins its own embedded target.
[workspace]

[dependencies]
cortex-m = { version = "0.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "0.2"
rtt-target = "0.5"

daplink-test-protocol = { path = "../../crates/daplink-test-protocol" }
stm32-usart-brr = { path = "../../crates/stm32-usart-brr" }

[[bin]]
name = "test-stm32f401"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
panic = "abort"
overflow-checks = false

[package]
name = "daplink-test"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
dap-conformance = { path = "../../crates/dap-conformance" }
daplink-core = { path = "../../crates/daplink-core" }
daplink-test-protocol = { path = "../crates/daplink-test-protocol" }
firmware-row = { path = "../../crates/firmware-row" }
# Decodes the probe firmware's defmt stream for the bench capture; 1.x pairs with defmt 1.x.
defmt-decoder = "1"
nusb = "0.2"
object = "0.36"
probe-rs = "0.32"
serialport = "4"

[dev-dependencies]
# Reads records back in tests, as an external consumer would.
serde_json = "1"

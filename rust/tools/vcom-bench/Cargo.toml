[package]
name = "vcom-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-side VCOM measurement bench"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dap-bench = { path = "../dap-bench" }
daplink-test-protocol = { path = "../../tests/crates/daplink-test-protocol" }
firmware-row = { path = "../../crates/firmware-row" }
object = "0.36"
nusb = "0.2"
probe-rs = "0.32"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serialport = "4"

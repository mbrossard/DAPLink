[package]
name = "swo-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-side CMSIS-DAP SWO capture benchmark"
publish = false

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dap-bench = { path = "../dap-bench" }
dap-conformance = { path = "../../crates/dap-conformance" }
firmware-row = { path = "../../crates/firmware-row" }
daplink-test-protocol = { path = "../../tests/crates/daplink-test-protocol" }
object = "0.36"
probe-rs = "0.32"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

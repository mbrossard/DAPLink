[package]
name = "swo-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-side CMSIS-DAP SWO capture benchmark"
publish = false

# Own workspace: host-only, resolved independently of any other crate's dependency graph.
[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The CMSIS-DAP v2 bulk transport, command codec and SWD attach are shared with the block-transfer
# benchmark rather than duplicated; only the SWO surface is new here.
dap-bench = { path = "../dap-bench" }
daplink-test-protocol = { path = "../../tests/crates/daplink-test-protocol" }
object = "0.36"
probe-rs = "0.32"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

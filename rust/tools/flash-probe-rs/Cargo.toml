[package]
name = "flash-probe-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Flash a target through a CMSIS-DAP probe via probe-rs"
publish = false

[workspace]

[dependencies]
daplink-probe-rs = { path = "../../crates/daplink-probe-rs" }
daplink-flash = { path = "../../crates/daplink-flash", features = ["log"] }
daplink-targets = { path = "../../crates/daplink-targets", features = [
    "stm32f401ce",
    "rp2040",
] }
# `cmsisdap_v1` keeps HID support for probes without a CMSIS-DAP v2 bulk interface.
probe-rs = { version = "0.32", default-features = false, features = ["cmsisdap_v1"] }
embedded-hal = "1.0"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

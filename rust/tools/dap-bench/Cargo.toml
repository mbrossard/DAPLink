[package]
name = "dap-bench"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Host-side CMSIS-DAP block-read throughput benchmark"
publish = false

# Own workspace: host-only, resolved independently of any other crate's dependency graph.
[workspace]

[dependencies]
nusb = "0.2"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
